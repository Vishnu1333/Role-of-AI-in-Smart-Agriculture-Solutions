<title id="t">Wheat yield result comparison</title><desc id="d">Same Li et al. 2022 study: Random Forest with NIRv R squared 0.74, RMSE 758 kilograms per hectare; EVI R squared 0.73, RMSE 762 kilograms per hectare.</desc>
<rect width="1100" height="460" rx="18" fill="#fbfcf8"/><text x="48" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#173f2b">Wheat-yield prediction: same-study comparison</text><text x="48" y="82" font-family="Arial,sans-serif" font-size="15" fill="#59665d">Li et al. (2022) · Random Forest configurations using vegetation-index inputs</text>
<text x="70" y="135" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#2d6a4f">R² (higher is better)</text>
<text x="615" y="135" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#376996">RMSE kg/ha (lower is better)</text>
<text x="70" y="190" font-family="Arial,sans-serif" font-size="17" fill="#24332a">RF + NIRv</text><rect x="210" y="169" width="270" height="30" rx="5" fill="#2d6a4f"/><text x="490" y="191" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f2b">0.74</text>
<text x="70" y="250" font-family="Arial,sans-serif" font-size="17" fill="#24332a">RF + EVI</text><rect x="210" y="229" width="266" height="30" rx="5" fill="#95b89b"/><text x="486" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f2b">0.73</text>
<text x="615" y="190" font-family="Arial,sans-serif" font-size="17" fill="#24332a">RF + NIRv</text><rect x="760" y="169" width="245" height="30" rx="5" fill="#376996"/><text x="1012" y="191" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f2b">758</text>
<text x="615" y="250" font-family="Arial,sans-serif" font-size="17" fill="#24332a">RF + EVI</text><rect x="760" y="229" width="246" height="30" rx="5" fill="#8797a3"/><text x="1012" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f2b">762</text>
<rect x="48" y="312" width="1004" height="75" rx="10" fill="#edf3eb"/><text x="70" y="342" font-family="Arial,sans-serif" font-size="16" fill="#24332a">Interpretation: NIRv is modestly better on both reported measures in this study only.</text><text x="70" y="367" font-family="Arial,sans-serif" font-size="15" fill="#59665d">This is not evidence that NIRv is universally superior across crops, regions, or validation protocols.</text>
<text x="48" y="430" font-family="Arial,sans-serif" font-size="13" fill="#68756c">Source: https://doi.org/10.1016/j.compag.2022.106790</text></svg>