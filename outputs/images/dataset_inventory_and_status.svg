<title id="t">Dataset inventory and availability</title><desc id="d">Named datasets from the literature and what is actually bundled in Fieldwise AI.</desc>
<rect width="1100" height="610" rx="18" fill="#fbfcf8"/><text x="45" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#173f2b">Named datasets and data contexts</text><text x="45" y="82" font-family="Arial,sans-serif" font-size="15" fill="#59665d">Literature sources cited by the research explorer; raw source datasets are not bundled</text>
<rect x="45" y="110" width="1010" height="45" rx="6" fill="#173f2b"/><text x="65" y="138" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Dataset / source</text><text x="395" y="138" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Published context</text><text x="800" y="138" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Project availability</text>
