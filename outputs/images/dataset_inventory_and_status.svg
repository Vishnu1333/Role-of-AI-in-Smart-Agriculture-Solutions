nt-family="Arial,sans-serif" font-size="14" fill="#24332a">Greenhouse smartphone images</text><text x="800" y="389" font-family="Arial,sans-serif" font-size="14" fill="#59665d">Study images not bundled</text><rect x="45" y="410" width="1010" height="49" fill="#f0f5ee" stroke="#d4ded4"/><text x="65" y="439" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#173f2b">Coffee leaf study</text><text x="395" y="439" font-family="Arial,sans-serif" font-size="14" fill="#24332a">Coffee leaf images in natural scenes</text><text x="800" y="439" font-family="Arial,sans-serif" font-size="14" fill="#59665d">Study images not bundled</text><rect x="45" y="460" width="1010" height="49" fill="#ffffff" stroke="#d4ded4"/><text x="65" y="489" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#173f2b">Rice irrigation DQN</text><text x="395" y="489" font-family="Arial,sans-serif" font-size="14" fill="#24332a">Weather-led irrigation simulation</text><text x="800" y="489" font-family="Arial,sans-serif" font-size="14" fill="#59665d">Simulation result in literature</text><rect x="45" y="510" width="1010" height="49" fill="#f0f5ee" stroke="#d4ded4"/><text x="65" y="539" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#173f2b">Fieldwise irrigation chart</text><text x="395" y="539" font-family="Arial,sans-serif" font-size="14" fill="#24332a">Synthetic moisture/rainfall/ET readings</text><text x="800" y="539" font-family="Arial,sans-serif" font-size="14" fill="#59665d">Illustrative app data only</text>
