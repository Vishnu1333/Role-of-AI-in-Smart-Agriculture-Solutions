<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="t d">
<title id="t">Conceptual AI-enabled smart agriculture pipeline</title><desc id="d">A six-stage conceptual pipeline from data sources to data quality control, edge/cloud services, ML and optimisation, decisions/actions, and feedback/governance.</desc>
<rect width="1100" height="610" rx="18" fill="#fbfcf8"/><text x="45" y="50" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173f2b">Conceptual AI-enabled smart-agriculture pipeline</text>
<rect x="100" y="86" width="900" height="62" rx="10" fill="#f1f5ed" stroke="#6f8580" stroke-width="1.5"/><text x="550" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f2b">1. Data sources</text><text x="550" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#34483d">Soil and weather sensors · UAV and satellite imagery · farm records</text><path d="M550 148 L550 165" stroke="#526c66" stroke-width="2.2"/><path d="M543 158 L550 167 L557 158" stroke="#526c66" stroke-width="2.2" fill="none"/><rect x="100" y="168" width="900" height="62" rx="10" fill="#ffffff" stroke="#6f8580" stroke-width="1.5"/><text x="550" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f2b">2. Ingestion and quality control</text><text x="550" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#34483d">Time alignment · calibration · missing/noisy data · label checks</text><path d="M550 230 L550 247" stroke="#526c66" stroke-width="2.2"/><path d="M543 240 L550 249 L557 240" stroke="#526c66" stroke-width="2.2" fill="none"/><rect x="100" y="250" width="900" height="62" rx="10" fill="#f1f5ed" stroke="#6f8580" stroke-width="1.5"/><text x="550" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f2b">3. Edge and cloud services</text><text x="550" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#34483d">Low-latency local inference · storage · controlled access</text><path d="M550 312 L550 329" stroke="#526c66" stroke-width="2.2"/><path d="M543 322 L550 331 L557 322" stroke="#526c66" stroke-width="2.2" fill="none"/><rect x="100" y="332" width="900" height="62" rx="10" fill="#ffffff" stroke="#6f8580" stroke-width="1.5"/><text x="550" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f2b">4. ML and optimisation</text><text x="550" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#34483d">Yield forecasts · vision detection · irrigation/resource decisions</text><path d="M550 394 L550 411" stroke="#526c66" stroke-width="2.2"/><path d="M543 404 L550 413 L557 404" stroke="#526c66" stroke-width="2.2" fill="none"/><rect x="100" y="414" width="900" height="62" rx="10" fill="#f1f5ed" stroke="#6f8580" stroke-width="1.5"/><text x="550" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f2b">5. Decision and action</text><text x="550" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#34483d">Explainable alerts · farmer approval · controller or robot action</text><path d="M550 476 L550 493" stroke="#526c66" stroke-width="2.2"/><path d="M543 486 L550 495 L557 486" stroke="#526c66" stroke-width="2.2" fill="none"/><rect x="100" y="496" width="900" height="62" rx="10" fill="#ffffff" stroke="#6f8580" stroke-width="1.5"/><text x="550" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f2b">6. Feedback and governance</text><text x="550" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#34483d">Observed outcomes · drift checks · retraining · privacy and audit</text>
</svg>