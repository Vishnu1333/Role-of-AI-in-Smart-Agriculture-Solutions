<title id="t">Fieldwise AI React website architecture</title><desc id="d">Catalogue metadata and selected chart data flow through a React and Vite interface to the research explorer, data visualisations, and Vercel or Netlify hosting.</desc>
<rect width="1100" height="560" rx="18" fill="#fbfcf8"/><text x="45" y="52" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173f2b">Fieldwise AI website architecture</text>
<rect x="130" y="90" width="840" height="90" rx="14" fill="#f1f5ed" stroke="#7f9d83" stroke-width="2"/><text x="550" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#173f2b">Curated research data</text><text x="550" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#40554a">58 catalogue records · selected source-linked metrics · study descriptions</text>
<path d="M550 180 L550 222" stroke="#7a887f" stroke-width="3" fill="none"/><path d="M541 213 L550 224 L559 213" stroke="#7a887f" stroke-width="3" fill="none"/>
